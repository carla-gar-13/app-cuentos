<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentacuentos · Lectura fácil</title>
<style>
:root{--bg:#F0E7D6;--tx:#120F0F;--card:#FAF4E8;--p:#FF5B25;--s:#6D8EEB;--g:#51BF56;--line:#d9ccb3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="azul"]{--bg:#DCE6F7;--card:#EEF3FC;--line:#b9c8e6}
:root[data-theme="verde"]{--bg:#DDEFD9;--card:#EEF8EB;--line:#b8d6b2}
:root[data-theme="oscuro"]{--bg:#1B1A1A;--tx:#E8E0D0;--card:#2A2827;--line:#454240}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Verdana,Geneva,sans-serif;font-size:17px;line-height:1.6;letter-spacing:.04em;min-height:100vh;text-align:left}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:1.5rem;line-height:1.3;margin:6px 0 6px}
p.lead{margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:0;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;overflow:hidden}
.card:hover,.card:focus-visible{border-color:var(--p);outline:none}
.card svg{display:block;width:100%;height:auto}
.card span{display:block;padding:12px 14px 16px;font-weight:bold}
.card small{display:block;font-weight:normal;font-size:.85rem;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;margin:14px 0 22px}
button{font:inherit;letter-spacing:inherit;color:inherit}
.btn{background:var(--p);color:#120F0F;border:0;border-radius:14px;padding:10px 16px;font-weight:bold;cursor:pointer;min-height:44px}
.btn.alt{background:var(--s)}
.btn:focus-visible,.sw:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--p);box-shadow:0 0 0 3px var(--p)}
.lbl{font-size:.85rem}
.sep{flex:1}
article{max-width:56ch}
article p{margin:0 0 1.3em;padding:8px 10px;border-radius:12px;border-left:6px solid transparent;cursor:pointer}
article p.on{background:var(--card);border-left-color:var(--g)}
.hint{font-size:.85rem;margin:0 0 14px}
.hide{display:none}
.end{background:var(--card);border:3px solid var(--g);border-radius:16px;padding:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <h1>Hola, lector</h1>
  <p class="lead">Elige un cuento para leer hoy.</p>
  <div class="grid" id="grid"></div>
</section>

<section id="read" class="hide">
  <button class="btn alt" id="back">← Volver a los cuentos</button>
  <div class="bar" role="group" aria-label="Ajustes de lectura">
    <span class="lbl">Letra</span>
    <button class="btn" id="minus" aria-label="Letra más pequeña">A−</button>
    <button class="btn" id="plus" aria-label="Letra más grande">A+</button>
    <span class="sep"></span>
    <span class="lbl">Fondo</span>
    <button class="sw" data-t="crema" aria-label="Fondo crema" style="background:#F0E7D6"></button>
    <button class="sw" data-t="azul" aria-label="Fondo azul claro" style="background:#DCE6F7"></button>
    <button class="sw" data-t="verde" aria-label="Fondo verde claro" style="background:#DDEFD9"></button>
    <button class="sw" data-t="oscuro" aria-label="Modo oscuro" style="background:#1B1A1A"></button>
  </div>
  <h1 id="title"></h1>
  <p class="hint">Toca un párrafo para marcar por dónde vas.</p>
  <article id="text"></article>
  <div class="end hide" id="end">¡Muy bien! Has terminado el cuento.<br><br><button class="btn" id="again">Elegir otro cuento</button></div>
</section>

</div>
<script>
var stories=[
{t:"El dragón miedoso",m:"3 min · 5 párrafos",c:"#FF5B25",b:"#FBD9C8",
p:["Había una vez un dragón pequeño llamado Pico.","A Pico le daba miedo su propio fuego. Cada vez que estornudaba, salía una chispa.","Un día, un gatito tenía frío en la nieve. Pico respiró muy suave.","Salió una llama pequeña y cálida. El gatito se calentó y ronroneó.","Desde ese día, Pico ya no tuvo miedo. Su fuego servía para ayudar."]},
{t:"La luna y el pez",m:"3 min · 5 párrafos",c:"#6D8EEB",b:"#D5E0FA",
p:["En un lago muy tranquilo vivía un pez llamado Nilo.","Cada noche veía la luna en el agua y quería tocarla.","Nilo nadó hasta el fondo y saltó muy alto. Splash.","No logró tocar la luna, pero vio miles de estrellas.","Entendió que la luna estaba lejos, pero siempre lo acompañaba."]},
{t:"El bosque de los abrazos",m:"3 min · 5 párrafos",c:"#51BF56",b:"#D3EFD0",
p:["En el bosque había un árbol muy grande y muy solo.","Los pájaros pasaban de largo porque sus ramas parecían duras.","Una niña llamada Lía se acercó y abrazó el tronco.","El árbol sintió algo nuevo y movió sus hojas despacio.","Desde entonces, todos los animales venían a su sombra. Ya no estaba solo."]}
];
function cover(s,i){
 var d=['<circle cx="100" cy="85" r="34" fill="'+s.c+'"/><circle cx="90" cy="78" r="5" fill="#120F0F"/><path d="M130 85l30-10-6 14z" fill="#FF5B25"/><path d="M80 100q20 14 40 0" stroke="#120F0F" stroke-width="4" fill="none"/>',
 '<circle cx="150" cy="45" r="24" fill="#F6E9A8"/><ellipse cx="90" cy="100" rx="40" ry="22" fill="'+s.c+'"/><path d="M128 100l26-18v36z" fill="'+s.c+'"/><circle cx="72" cy="94" r="4" fill="#120F0F"/>',
 '<rect x="92" y="90" width="16" height="50" fill="#8A5A3A"/><circle cx="100" cy="68" r="38" fill="'+s.c+'"/><circle cx="84" cy="62" r="4" fill="#120F0F"/><circle cx="116" cy="62" r="4" fill="#120F0F"/><path d="M88 78q12 10 24 0" stroke="#120F0F" stroke-width="4" fill="none"/>'][i];
 return '<svg viewBox="0 0 200 150" role="img" aria-label="Dibujo de '+s.t+'"><rect width="200" height="150" fill="'+s.b+'"/>'+d+'</svg>';
}
var size=22,cur=0,$=function(i){return document.getElementById(i)};
stories.forEach(function(s,i){
 var b=document.createElement('button');b.className='card';
 b.innerHTML=cover(s,i)+'<span>'+s.t+'<small>'+s.m+'</small></span>';
 b.onclick=function(){open(i)};$('grid').appendChild(b);
});
function open(i){
 cur=i;var s=stories[i];$('title').textContent=s.t;
 var a=$('text');a.innerHTML='';
 s.p.forEach(function(x,k){
  var p=document.createElement('p');p.textContent=x;
  p.onclick=function(){
   [].forEach.call(a.children,function(c){c.classList.remove('on')});
   p.classList.add('on');
   $('end').classList.toggle('hide',k!==s.p.length-1);
  };a.appendChild(p);
 });
 $('end').classList.add('hide');
 a.style.fontSize=size+'px';
 $('home').classList.add('hide');$('read').classList.remove('hide');window.scrollTo(0,0);
}
function home(){$('read').classList.add('hide');$('home').classList.remove('hide');window.scrollTo(0,0)}
$('back').onclick=home;$('again').onclick=home;
$('minus').onclick=function(){size=Math.max(16,size-2);$('text').style.fontSize=size+'px'};
$('plus').onclick=function(){size=Math.min(34,size+2);$('text').style.fontSize=size+'px'};
var sw=document.querySelectorAll('.sw');
function theme(t){document.documentElement.setAttribute('data-theme',t);
 [].forEach.call(sw,function(b){b.setAttribute('aria-pressed',b.dataset.t===t)})}
[].forEach.call(sw,function(b){b.onclick=function(){theme(b.dataset.t)}});
theme('crema');
</script>
</body>
</html>
